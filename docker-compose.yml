# Shelf Life on the PC. Start with `docker compose up -d --build`; Docker
# starts the services again on boot (restart: unless-stopped).
# Secrets live in `.env` (never versioned); see `.env.example`.

name: shelf_life

x-common: &common
  # Built once by `web`; `scheduler` reuses the same local image.
  image: shelf_life:local
  restart: unless-stopped
  environment:
    TZ: America/Sao_Paulo
    SHELF_LIFE_DB: /data/shelf_life.db
    SHELF_LIFE_BACKUP_DIR: /backups
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *common
    build:
      context: .
      args:
        UID: ${SHELF_LIFE_UID:-1000}
        GID: ${SHELF_LIFE_GID:-1000}
    ports:
      # Only the PC's loopback, no login. 25080 is free on this PC (Grafana
      # uses 23000; 3000, 5000, 8080, 8082 and 9090 belong to other projects).
      - "127.0.0.1:${SHELF_LIFE_PORT:-25080}:8000"
    volumes:
      - data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    <<: *common
    # Daily routine (expiry check, Telegram digest, backup): at startup and
    # every day at 09:00 America/Sao_Paulo, never two runs at once (flock).
    command: ["shelf-life-scheduler"]
    pull_policy: never
    env_file:
      - path: .env
        required: true
    volumes:
      - data:/data
      - type: bind
        source: ${SHELF_LIFE_BACKUP_HOST_DIR:-/home/conan/Desktop/backups/shelf_life}
        target: /backups
        bind:
          # Fail instead of letting Docker create a root-owned folder.
          create_host_path: false
    mem_limit: 128m
    depends_on:
      - web

volumes:
  # Holds /data/shelf_life.db. Survives `docker compose down`, rebuilds and
  # recreated containers; only `docker compose down -v` deletes it.
  data:
