{% extends "base.html" %}
{% block content %}
<h1>Stock</h1>
<table>
<tr><th>Food</th><th>Quantity</th><th>Expiry</th><th>Group</th></tr>
{% for p in purchases %}
<tr{% if p.expired %} class="expired"{% endif %}>
  <td>{{ p.name }}</td><td>{{ p.quantity }} {{ p.unit }}</td>
  <td>{{ p.expiry_display or "" }}</td><td>{{ p.group }}</td>
</tr>
{% else %}
<tr><td colspan="4">No purchases yet.</td></tr>
{% endfor %}
</table>
{% endblock %}
