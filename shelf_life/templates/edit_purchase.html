{% extends "base.html" %}
{% block content %}
<h1>Edit {{ p.name }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web.edit_purchase', purchase_id=p.id) }}">
  <p><label>Quantity <input name="quantity" value="{{ form.get('quantity', p.quantity) }}"></label>
  <select name="unit">
    {% for u in units %}<option value="{{ u }}"{% if u == form.get('unit', p.unit) %} selected{% endif %}>{{ u }}</option>{% endfor %}
  </select></p>
  <p><label>Expiry (YYYY-MM-DD or YYYY-MM) <input name="expiry" value="{{ form.get('expiry', p.expiry_display or '') }}"></label></p>
  <p><label>Group
  <select name="group">
    {% for g in groups %}<option value="{{ g }}"{% if g == form.get('group', p.group) %} selected{% endif %}>{{ g }}</option>{% endfor %}
  </select></label></p>
  <button type="submit">Save</button>
</form>
<h2>Move part to the other group</h2>
<form method="post" action="{{ url_for('web.move_purchase', purchase_id=p.id) }}">
  <input type="hidden" name="group" value="{{ 'Reserve' if p.group == 'Pantry' else 'Pantry' }}">
  <input name="quantity" placeholder="Quantity">
  <select name="unit">
    {% for u in units %}<option value="{{ u }}"{% if u == p.unit %} selected{% endif %}>{{ u }}</option>{% endfor %}
  </select>
  <button type="submit">Move to {{ 'Reserve' if p.group == 'Pantry' else 'Pantry' }}</button>
</form>
{% endblock %}
