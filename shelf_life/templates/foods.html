{% extends "base.html" %}
{% block content %}
<h1>Foods</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if confirm %}
<form method="post" action="{{ url_for('web.update_food', food_id=confirm.id) }}">
  <p class="error">{{ confirm.message }}</p>
  <input type="hidden" name="name" value="{{ form.get('name', '') }}">
  <input type="hidden" name="unit" value="{{ form.get('unit', '') }}">
  <input type="hidden" name="milestones" value="{{ form.get('milestones', '') }}">
  <input type="hidden" name="confirm_merge" value="1">
  <button type="submit">Merge</button>
  <a href="{{ url_for('web.foods_page') }}">Cancel</a>
</form>
{% endif %}
<table>
<tr><th>Name</th><th>Unit</th><th>Warning milestones (days, e.g. 30,7,0; blank uses the group's)</th><th></th></tr>
{% for f in foods %}
<tr>
  <form method="post" action="{{ url_for('web.update_food', food_id=f.id) }}">
  <td><input name="name" value="{{ f.name }}"></td>
  <td><select name="unit">{% for u in units %}<option{% if u == f.unit %} selected{% endif %}>{{ u }}</option>{% endfor %}</select></td>
  <td><input name="milestones" value="{{ f.milestones }}"></td>
  <td><button type="submit">Save</button></td>
  </form>
</tr>
{% else %}
<tr><td colspan="4">No foods yet.</td></tr>
{% endfor %}
</table>
{% endblock %}
