{% extends "base.html" %}
{% block content %}
<h1>Record a removal</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web.create_removal') }}">
  <p><label>Food <input name="name" value="{{ form.get('name', '') }}"></label></p>
  <p><label>Quantity <input name="quantity" value="{{ form.get('quantity', '') }}"></label>
  <select name="unit">{% for u in units %}<option{% if form.get('unit') == u %} selected{% endif %}>{{ u }}</option>{% endfor %}</select></p>
  <p><label>Reason <select name="reason"><option>used</option><option>discarded</option></select></label></p>
  <p><label>Deduct from
    <select name="purchase_id">
      <option value="">Nearest expiry first</option>
      {% for p in purchases %}<option value="{{ p.id }}"{% if form.get('purchase_id')|string == p.id|string %} selected{% endif %}>{{ p.name }}, {{ p.quantity }} {{ p.unit }}, {{ p.expiry_display or "no expiry" }}, {{ p.group }}</option>{% endfor %}
    </select></label></p>
  <button>Remove</button>
</form>
{% endblock %}
