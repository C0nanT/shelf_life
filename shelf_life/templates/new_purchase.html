{% extends "base.html" %}
{% block content %}
<h1>New purchase</h1>
{% if added %}<p class="added">Saved {{ added }}. Add the next one.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web.create_purchase') }}">
  <p><label>Name <input name="name" list="food-names" autocomplete="off" autofocus value="{{ form.get('name', '') }}" required></label>
  <datalist id="food-names"></datalist></p>
  <p><label>Quantity <input name="quantity" value="{{ form.get('quantity', '') }}" required></label>
  <select name="unit" id="unit">{% for u in units %}<option{% if form.get('unit') == u %} selected{% endif %}>{{ u }}</option>{% endfor %}</select></p>
  <p><label>Expiry (YYYY-MM-DD or YYYY-MM) <input name="expiry" value="{{ form.get('expiry', '') }}"></label></p>
  <p><label>Group <select name="group">{% for g in groups %}<option{% if form.get('group') == g %} selected{% endif %}>{{ g }}</option>{% endfor %}</select></label></p>
  <button type="submit">Save</button>
  <button type="submit" name="again" value="1">Save and add another</button>
</form>
<script>
(function () {
  var name = document.querySelector('input[name=name]');
  var unit = document.getElementById('unit');
  var list = document.getElementById('food-names');
  var known = {};
  function fillUnit() {
    var u = known[name.value.trim().toLowerCase()];
    if (u) unit.value = u;
  }
  name.addEventListener('input', function () {
    fillUnit();
    fetch('{{ url_for("web.api_suggest_foods") }}?q=' + encodeURIComponent(name.value))
      .then(function (r) { return r.json(); })
      .then(function (foods) {
        list.innerHTML = '';
        foods.forEach(function (f) {
          known[f.name.toLowerCase()] = f.unit;
          var o = document.createElement('option');
          o.value = f.name;
          list.appendChild(o);
        });
        fillUnit();
      });
  });
})();
</script>
{% endblock %}
